<style>
  :root { --paper: #fbfaf7; --ink: #1d2433; --muted: #667085; --rule: #e7e2d9; --teal: #12636b; --clay: #d1603d; }
  html { background: var(--paper); }
  body { margin: 0; padding: 96px 28px; color: var(--ink); font: 17px/1.6 "Inter", system-ui, sans-serif; }

  p.sub { color: var(--muted); margin: 0 0 40px; }
  a.card {
    display: block; text-decoration: none; color: inherit; background: #fff;
    border: 1px solid var(--rule); border-radius: 12px; padding: 20px 24px; margin-bottom: 14px;
    transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: var(--clay); transform: translateY(-1px); }
  a.card b { display: block; font-size: 18px; margin-bottom: 2px; }
  a.card span { color: var(--muted); font-size: 15px; }
