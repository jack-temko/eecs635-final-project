; CSI capture firmware for ESP32-S3
; Change `board` if you're not on a Seeed XIAO ESP32S3 (e.g. esp32-s3-devkitc-1)

[env:csi]
platform = espressif32@6.8.0
framework = espidf
board = seeed_xiao_esp32s3
monitor_speed = 921600
monitor_filters = direct
; Native USB drops out when esptool's stub changes baud; skip the stub.
upload_speed = 115200
upload_flags = --no-stub
